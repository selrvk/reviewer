<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amdocs Interview Reviewer</title>
  <meta name="description" content="Study notes, interview Q&A, quizzes and a timed mock exam for Amdocs interviews: Java, Unix/Linux, SQL, telecom basics and HR.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315181d'/%3E%3Ctext x='6' y='22' font-family='monospace' font-size='16' font-weight='700' fill='%234ade80'%3E%3E_%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // apply saved theme before paint (avoids a flash)
    try {
      var s = JSON.parse(localStorage.getItem("amdocs-reviewer:v1") || "{}");
      if (s.theme) document.documentElement.setAttribute("data-theme", s.theme);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <button class="icon-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/"><span class="brand-mark">&gt;_</span> amdocs-review</a>
  </header>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/"><span class="brand-mark">&gt;_</span> amdocs-review</a>

      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search everything" autocomplete="off" aria-label="Search notes and questions">
        <kbd>/</kbd>
      </div>

      <nav class="tree" id="nav" aria-label="Sections"></nav>

      <div class="sidebar-foot">
        <button class="ghost-btn" id="theme-btn" type="button"></button>
        <button class="ghost-btn" id="reset-btn" type="button">Reset progress</button>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/data/java.js"></script>
  <script src="js/data/linux.js"></script>
  <script src="js/data/sql.js"></script>
  <script src="js/data/amdocs.js"></script>
  <script src="js/data/practice-java.js"></script>
  <script src="js/data/practice-sql.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
